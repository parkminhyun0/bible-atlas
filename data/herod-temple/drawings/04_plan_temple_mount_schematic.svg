<text x="500.0" y="746.0" font-size="8" fill="#b33" text-anchor="start" font-weight="400">이중(훌다) 문</text>
<circle cx="586.5" cy="742.0" r="5" fill="#b33" stroke="#fff" stroke-width="1"/>
<text x="594.5" y="746.0" font-size="8" fill="#b33" text-anchor="start" font-weight="400">삼중(훌다) 문</text>
<circle cx="737.5" cy="394.3" r="5" fill="#b33" stroke="#fff" stroke-width="1"/>
<text x="745.5" y="398.3" font-size="8" fill="#b33" text-anchor="start" font-weight="400">수산 문(축선상)</text>
<circle cx="600.0" cy="100.8" r="5" fill="#b33" stroke="#fff" stroke-width="1"/>
<text x="608.0" y="104.8" font-size="8" fill="#b33" text-anchor="start" font-weight="400">타디 문(미사용)</text>
<rect x="438.0" y="746.8" width="89.1" height="14.0" fill="#e8e0cc" stroke="#555" stroke-width="1" opacity="1"/>
<text x="482.6" y="778.8" font-size="8" fill="#555" text-anchor="middle" font-weight="400">남측 대계단 30단·폭 65.5 m(발굴)</text>
<line x1="1100.0" y1="120.0" x2="1100.0" y2="80.0" stroke="#222" stroke-width="2"/>
<polygon points="1100.0,74.0 1094.0,88.0 1106.0,88.0" fill="#222" stroke="#333" stroke-width="1.2"/>
<text x="1100.0" y="138.0" font-size="12" fill="#222" text-anchor="middle" font-weight="700">N</text>
<line x1="60.0" y1="790.0" x2="195.0" y2="790.0" stroke="#222" stroke-width="2"/>
<text x="127.5" y="784.0" font-size="9" fill="#222" text-anchor="middle" font-weight="400">100 m</text>
<text x="20.0" y="808.0" font-size="9" fill="#555" text-anchor="start" font-weight="400">주: 이 도면은 개략도. 실제 벽선·문 위치는 Ritmeyer 도면/측량 좌표(GeoJSON)로 교체. 성역 위치는 Ritmeyer 가설(성소 = 바위 돔 위치).</text>
</svg>