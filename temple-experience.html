<body>
<main id="experience" aria-label="헤롯 성전 1인칭 체험">
  <div id="viewport"></div>
  <button id="exitExperience" type="button" aria-label="체험을 끝내고 BibleAtlas 지도로 돌아가기">×</button>
  <section id="status" aria-live="polite">
    <strong>AD 30 · 헤롯 성전</strong>
    <span id="statusText">모델을 불러오는 중…</span>
  </section>
  <section id="instructions">
    <b>이동</b> WASD · 방향키　<b>점프</b> Space　<b>시선</b> 마우스/트랙패드　<b>해제</b> Esc
  </section>
  <section id="startScreen" class="open" role="dialog" aria-modal="true" aria-labelledby="startTitle">
    <div class="startCard">
      <span class="eyebrow">BIBLEATLAS · WALKTHROUGH PROTOTYPE</span>
      <h1 id="startTitle">1세기 예루살렘 성전 둘러보기</h1>
      <p>기존 사료·치수표·A/B/C 근거 등급으로 만든 동일한 GLB 모델을 1인칭 시점에서 살펴보는 테스트입니다.</p>
      <fieldset id="spawnChoices" disabled>
        <legend>시작 위치</legend>
        <button type="button" class="spawnChoice active" data-spawn="outside">성전산 밖 · 남쪽 계단</button>
        <button type="button" class="spawnChoice" data-spawn="gentiles">이방인의 뜰 안</button>
      </fieldset>
      <button id="startExperience" type="button" disabled>모델 준비 중…</button>
      <small>성소에는 등잔대·진설병상·분향단이 있습니다. AD 30의 지성소는 사료에 따라 기반석 외에는 비어 있게 보존합니다.</small>
    </div>
  </section>
  <div id="crosshair" aria-hidden="true"></div>
</main>
